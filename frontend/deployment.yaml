apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      initContainers:
      - name: wait-for-backend
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            echo "Waiting for backend to be ready..."
            # Loop until backend-service responds on port 8080
            until nc -z api-gateway-service 8080; do
              echo "Backend not ready, sleeping 5s..."
              sleep 5
            done
            echo "Backend is ready!"
      containers:
      - name: frontend
        image: shejulv088/final_frontend:v1
        ports:
        - containerPort: 80
          #        resources:
          #        requests:
          #          memory: "256Mi"
          #          cpu: "250m"
          #         limits:
          #        memory: "512Mi"
          #       cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 120
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10

