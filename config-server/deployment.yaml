apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server-deploy
  namespace: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configserver-backend
  template:
    metadata:
      labels:
        app: configserver-backend
    spec:

      containers:
      - name: config-server
        image: shejulv088/final_config_server:v1
        ports:
        - containerPort: 8888
        
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8888
          initialDelaySeconds: 60
          periodSeconds: 20

        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8888
          initialDelaySeconds: 30
          periodSeconds: 15
            #        resources:
          #          requests:
            #            memory: "150Mi"
              #            cpu: "50m"
              #          limits:
            #            memory: "200Mi"
            #            cpu: "100m"
